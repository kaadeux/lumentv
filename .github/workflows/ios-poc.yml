# Phase 0 of the iPhone version: builds the test app (ios-poc/) into an unsigned IPA, signed later on the iPhone by
# SideStore with the owner's free Apple ID. Runs on GitHub's Macs: no Mac needed.
name: iOS test app (phase 0)

on:
  push:
    branches: [ios-poc]
    paths: ["ios-poc/**", ".github/workflows/ios-poc.yml"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Project (XcodeGen)
        working-directory: ios-poc
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Swift packages (KSPlayer, FFmpegKit)
        uses: actions/cache@v4
        with:
          path: ios-poc/build/SourcePackages
          key: spm-${{ hashFiles('ios-poc/project.yml') }}

      - name: Build
        working-directory: ios-poc
        run: |
          set -o pipefail
          xcodebuild -project LumenPOC.xcodeproj -scheme LumenPOC -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 200

      - name: IPA
        working-directory: ios-poc
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LumenPOC.app Payload/
          zip -qry LumenPOC.ipa Payload
          ls -la LumenPOC.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LumenPOC-ipa
          path: ios-poc/LumenPOC.ipa
          retention-days: 14
