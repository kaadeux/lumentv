# The iPhone app (phase 3): the shared Kotlin app built into LumenKit.framework (Gradle), then the Swift shell
# (iosApp/, XcodeGen) with KSPlayer into an unsigned IPA, signed later on the iPhone by SideStore.
name: iPhone app

# Started by hand only (Actions tab, or the API): a macOS run counts about ten times its length in the plan's free
# minutes, so the iPhone app is built once per version to publish, not at every push.
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Gradle and Kotlin/Native caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: kmp-app-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Kotlin framework (LumenKit)
        run: chmod +x gradlew && ./gradlew --no-daemon :phoneui:linkReleaseFrameworkIosArm64

      - name: Project (XcodeGen)
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Swift packages (KSPlayer, FFmpegKit)
        uses: actions/cache@v4
        with:
          path: iosApp/build/SourcePackages
          key: spm-${{ hashFiles('iosApp/project.yml') }}

      - name: Build
        working-directory: iosApp
        env:
          LUMEN_TMDB_KEY: ${{ secrets.LUMEN_TMDB_KEY }}
          LUMEN_SYNC_URL: ${{ secrets.LUMEN_SYNC_URL }}
        run: |
          xcodebuild -project LumenTV.xcodeproj -scheme LumenTV -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            LUMEN_TMDB_KEY="$LUMEN_TMDB_KEY" LUMEN_SYNC_URL="$LUMEN_SYNC_URL" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1             || { grep -E "error:" -A4 build.log | head -120; exit 1; }
          tail -n 20 build.log

      # The IPA holds the TMDB key and the sync server's address (Info.plist): it leaves the runner encrypted only,
      # so the repository can be public (anyone signed in to GitHub can download a public repository's artifacts).
      # The owner decrypts it on the PC with the same password before putting it on the private SideStore source:
      #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in LumenTV.ipa.enc -out LumenTV.ipa -pass file:.ipa_password
      - name: IPA (encrypted)
        working-directory: iosApp
        env:
          LUMEN_IPA_PASSWORD: ${{ secrets.LUMEN_IPA_PASSWORD }}
        run: |
          if [ -z "$LUMEN_IPA_PASSWORD" ]; then echo "Secret LUMEN_IPA_PASSWORD missing: no IPA is uploaded in clear."; exit 1; fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LumenTV.app Payload/
          zip -qry LumenTV.ipa Payload
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in LumenTV.ipa -out LumenTV.ipa.enc -pass env:LUMEN_IPA_PASSWORD
          rm -rf LumenTV.ipa Payload
          ls -la LumenTV.ipa.enc

      - uses: actions/upload-artifact@v4
        with:
          name: LumenTV-ipa-encrypted
          path: iosApp/LumenTV.ipa.enc
          retention-days: 7
